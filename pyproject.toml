[project]
name = "orca-talkback"
version = "0.1.2"
description = "Hear your Orca coding agents talk back: spoken reply summaries with voice barge-in, fully local audio."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Callum Macpherson" }]
requires-python = ">=3.11,<3.15"
keywords = ["orca", "claude-code", "text-to-speech", "voice", "kokoro", "barge-in", "echo-cancellation"]
classifiers = [
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "kokoro-onnx>=0.4",
    "livekit>=1.1.5",
    "numpy>=2.1",
    "onnxruntime>=1.17",
    "silero-vad>=5.1",
    "sounddevice>=0.5",
    "torch>=2.0",
]

[project.scripts]
orca-talkback = "orca_talkback.__main__:main"

[project.urls]
Homepage = "https://github.com/CallumJMac/orca-talkback"
Issues = "https://github.com/CallumJMac/orca-talkback/issues"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orca_talkback"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:anyio"

[tool.ruff.lint]
extend-ignore = [
    "BLE001",  # broad excepts are deliberate: a misbehaving audio device or Orca must never stop the daemon
    "TRY004",  # ValueError for bad request payloads is what the HTTP handler turns into a 400
]
